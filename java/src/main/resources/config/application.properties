# Application settings
app.name=MarketMind
app.version=1.0.0
app.model.version=1.0.0
app.learning-rate=0.01
# gRPC endpoint configuration
grpc.endpoint=localhost:50051
# gRPC SSL certificate (optional, only needed for secure/TLS connections)
grpc.cert.path=certs/server.crt
grpc.key.path=certs/server.key
# Optionally, if you use a CA certificate for client verification
grpc.ca.path=certs/ca.crt
# Spring Boot settings
spring.application.name=MarketMind
spring.profiles.active=dev
spring.docker.compose.enabled=false
# Data source
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# WebSocket
spring.websocket.allowed-origins=*
# API settings
api.ib.endpoint=https://localhost:5000
api.fred.key=fred_fake_key
# Monitoring and metrics
management.metrics.tags.component=frontend
management.influx.metrics.export.enabled=false
management.influx.metrics.export.uri=http://localhost:8086
management.influx.metrics.export.db=marketmind_metrics
management.influx.metrics.export.step=10s
# MarketMind custom settings
#marketmind.ml.model-path=/path/to/model
backend.cpp.host=localhost
backend.cpp.port=50051
backend.cpp.tlsCertPath=certs/client.crt
backend.cpp.tlsKeyPath=certs/client.key
backend.cpp.tlsCaPath=certs/ca.crt
backend.python.host=python.backend.local
backend.python.port=50051
useMockBackend=true
bypassAuth=true
dataStorageMode=memory