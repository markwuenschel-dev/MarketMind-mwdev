// cpp_service.proto
syntax = "proto3";
package com.marketmind;

option java_multiple_files = true;
option java_package = "com.marketmind.grpc";
option java_outer_classname = "CppServiceProto";

// C++ Backend Service
service CppService {
  rpc Call (CppRequest) returns (CppResponse) {}
}

message CppRequest {
  string request_id = 1;
  string algorithm_name = 2;
  bytes input_data = 3;
  map<string, string> parameters = 4;
}

// C++ Response Message
message CppResponse {
  string request_id = 1;
  bool success = 2;
  string error_message = 3;
  bytes output_data = 4;
  map<string, string> metadata = 5;
}